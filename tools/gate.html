<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Range Holiday Dinner &amp; Awards Gala</title>
<style>
  :root{--gold:#d4af37;--gold-hi:#f4dc9d}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#050505;color:#eee;font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate{width:100%;max-width:560px;text-align:center}
  .gate img{width:100%;height:auto;display:block;border:1px solid rgba(212,175,55,.35)}
  h1{font-weight:400;letter-spacing:.32em;text-transform:uppercase;font-size:.8rem;color:var(--gold);margin:30px 0 8px}
  p{color:#bbb;font-size:.95rem;margin:0 0 22px}
  form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  input{flex:1 1 220px;max-width:300px;padding:13px 16px;background:#0e0e0e;border:1px solid rgba(212,175,55,.5);color:#fff;font-size:1rem;font-family:inherit;border-radius:2px}
  input:focus{outline:none;border-color:var(--gold-hi)}
  button{padding:13px 26px;background:var(--gold);color:#111;border:0;font-family:inherit;letter-spacing:.24em;text-transform:uppercase;font-size:.78rem;cursor:pointer;border-radius:2px}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#e8806f;min-height:1.4em;margin-top:14px;font-size:.9rem}
</style>
</head>
<body>
<main class="gate">
  <img src="assets/gala-banner.jpg" alt="You're invited to the Range 2026 Holiday Dinner & Awards Gala">
  <h1>Guest Access</h1>
  <p>Please enter the event password to continue.</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="Password" aria-label="Event password" autofocus required>
    <button id="go" type="submit">Enter</button>
  </form>
  <div class="err" id="err" role="alert"></div>
</main>
<script>
const PAYLOAD = __PAYLOAD__;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}
async function tryOpen(pw, silent) {
  try {
    const html = await open_(pw);
    try { sessionStorage.setItem('rg_pw', pw); } catch (e) {}
    document.open(); document.write(html); document.close();
    return true;
  } catch (e) {
    if (!silent) document.getElementById('err').textContent = 'That password is not correct. Please try again.';
    return false;
  }
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'); btn.disabled = true; document.getElementById('err').textContent = '';
  const ok = await tryOpen(document.getElementById('pw').value, false);
  if (!ok) btn.disabled = false;
});
(async () => { let s = null; try { s = sessionStorage.getItem('rg_pw'); } catch (e) {} if (s) await tryOpen(s, true); })();
</script>
</body>
</html>
